<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maijev</title>
<style>
  :root {
    --bg: #f8fafc; --fg: #1e293b; --dim: #64748b; --line: #e2e8f0;
    --primary: #3b82f6; --accent: #f97316; --ok: #16a34a; --err: #dc2626;
    --card: #fff; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.55;
    font-family: Inter, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; transition: all .15s;
  }
  button:hover { border-color: #bfdbfe; background: #eff6ff; }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  button.primary:hover { background: #2563eb; }
  button.accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.accent:hover { background: #ea580c; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text], select, textarea {
    font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; background: var(--card); color: var(--fg);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid #bfdbfe; border-color: var(--primary); }
  textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; resize: vertical; }
  label { display: block; font-size: 12px; color: var(--dim); font-weight: 600; margin: 12px 0 4px; letter-spacing: .04em; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13.5px; color: var(--fg); font-weight: 400; letter-spacing: 0; }
  .check input { width: auto; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 4px; }
  code { font-family: var(--mono); font-size: 12px; color: var(--accent); }

  header {
    display: flex; align-items: center; gap: 18px; padding: 14px 24px;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  header h1 em { font-style: normal; color: var(--primary); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--dim); font-family: var(--mono);
  }
  .chip.ok { border-color: #bbf7d0; background: #f0fdf4; color: var(--ok); }
  .chip.no { border-color: #fecaca; background: #fef2f2; color: var(--err); }
  header .spacer { flex: 1; }
  header .runs { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }

  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px 24px; min-height: calc(100vh - 57px); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: 0 6px 24px -14px rgba(30,41,59,.14); }
  .card h2 { font-size: 13px; letter-spacing: .1em; color: var(--dim); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
  .col { display: flex; flex-direction: column; gap: 18px; }

  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .browser { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow: auto; font-size: 12.5px; display: none; }
  .browser.open { display: block; }
  .browser .path { padding: 6px 10px; background: var(--bg); font-family: var(--mono); font-size: 11.5px; color: var(--dim); border-bottom: 1px solid var(--line); word-break: break-all; }
  .browser div.item { padding: 5px 10px; cursor: pointer; display: flex; gap: 8px; }
  .browser div.item:hover { background: #eff6ff; }
  .browser .item.dir::before { content: "▸"; color: var(--dim); }
  .browser .item.file::before { content: "▪"; color: var(--primary); }
  .modes { display: flex; gap: 6px; }
  .modes button { flex: 1; padding: 7px 4px; font-size: 13px; }
  .modes button.on { background: #eff6ff; border-color: var(--primary); color: var(--primary); font-weight: 600; }

  .jobs { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow: auto; }
  .jobs li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .jobs li:hover { background: var(--bg); }
  .jobs li.sel { background: #eff6ff; }
  .jobs .name { flex: 1; font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.run { background: var(--primary); animation: pulse 1.2s ease-in-out infinite; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }

  .empty { color: var(--dim); text-align: center; padding: 60px 0; }
  .detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .detail-head h3 { font-family: var(--mono); font-size: 16px; font-weight: 600; flex: 1; word-break: break-all; }
  .detail-head .src { color: var(--dim); font-size: 12px; font-family: var(--mono); word-break: break-all; }

  .stages { display: flex; gap: 6px; margin: 6px 0 16px; }
  .stage { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); transition: all .2s; }
  .stage .n { font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: .1em; }
  .stage .t { font-weight: 600; font-size: 14px; margin-top: 2px; }
  .stage .s { font-size: 12px; color: var(--dim); font-family: var(--mono); margin-top: 2px; min-height: 17px; }
  .stage.done { background: #f0fdf4; border-color: #bbf7d0; }
  .stage.done .t { color: var(--ok); }
  .stage.active { background: #eff6ff; border-color: var(--primary); box-shadow: 0 0 0 3px #dbeafe; }
  .stage.active .t { color: var(--primary); }
  .stage.err { background: #fef2f2; border-color: #fecaca; }
  .stage.err .t { color: var(--err); }
  .stage.skip { opacity: .4; }

  .facts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .fact { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; background: var(--bg); }
  .fact b { color: var(--primary); font-family: var(--mono); }

  .files { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .files a { border: 1px solid #bfdbfe; background: #eff6ff; border-radius: 8px; padding: 6px 12px; font-family: var(--mono); font-size: 12.5px; }
  .files a.main { background: var(--primary); color: #fff; border-color: var(--primary); }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .glossary-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .glossary-actions .hint { margin: 0; flex: 1; }

  pre.log, pre.srt {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: #0f172a; color: #cbd5e1;
    border-radius: 10px; padding: 12px 14px; height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  pre.srt { background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-size: 12.5px; }
  pre.log .ok { color: #86efac; } pre.log .err { color: #fca5a5; } pre.log .cmd { color: #93c5fd; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--fg); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .two { grid-template-columns: 1fr; } .stages { flex-wrap: wrap; } .stage { min-width: 30%; } header .runs { display: none; } }
</style>
</head>
<body>
<header>
  <h1>mai<em>jev</em></h1>
  <div class="chips" id="envChips"></div>
  <div class="spacer"></div>
  <div class="runs" id="runsDir"></div>
</header>

<main>
  <aside class="col">
    <section class="card">
      <h2>新建任务</h2>
      <label>输入：本地路径 / BV… / TVer ep… / Abema / YouTube URL</label>
      <div class="row">
        <input type="text" id="input" placeholder="/path/to/video.mp4 或 BV1ZArvBaEqL">
        <button id="browseBtn" title="浏览服务器上的文件">浏览</button>
      </div>
      <div class="browser" id="browser"></div>
      <label>任务名（可选，留空按文件名）</label>
      <input type="text" id="name" placeholder="同名会续跑已有缓存">
      <label>输出</label>
      <div class="modes" id="modes">
        <button data-mode="asr">仅 ASR 基线</button>
        <button data-mode="ja">日文合并</button>
        <button data-mode="zh" class="on">日文 + 中文</button>
      </div>
      <div id="zhOpts">
        <label class="check"><input type="checkbox" id="prepass" checked> 生成自动词库（pre-pass）</label>
        <div class="hint">不需要 OCR。用字幕全文归并人名/地名/节目名，翻译后可在右侧手动修正再重翻。</div>
        <label>OCR JSON（可选）</label>
        <input type="text" id="ocr" placeholder="外部 OCR 产出的 ocr.json 路径">
        <div class="hint" id="ocrHint"></div>
      </div>
      <label class="check"><input type="checkbox" id="frames"> 抽取稀疏代表帧（供外部 OCR）</label>
      <label>模型</label>
      <div class="row">
        <input type="text" id="model" list="models" placeholder="默认">
        <select id="thinking" style="width:110px" title="3.x 模型的 thinkingLevel">
          <option value="">思考默认</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option>
        </select>
      </div>
      <datalist id="models">
        <option value="gemini-2.5-pro"><option value="gemini-3.1-pro-preview"><option value="gemini-3.8-flash">
      </datalist>
      <div class="hint">merge / translate 推荐 pro 级：契约遵循度更稳，重试更少。</div>
      <div style="margin-top:16px"><button class="primary" id="startBtn" style="width:100%">开始</button></div>
    </section>

    <section class="card">
      <h2>任务</h2>
      <ul class="jobs" id="jobs"></ul>
    </section>
  </aside>

  <section class="card" id="detail">
    <div class="empty">选择或新建一个任务</div>
  </section>
</main>

<template id="detailTpl">
  <div class="detail-head">
    <div>
      <h3 class="jid"></h3>
      <div class="src"></div>
    </div>
    <button class="rerunBtn" title="复用 ASR / 合并缓存，只重跑变化的阶段">重跑</button>
    <button class="cancelBtn danger">停止</button>
  </div>
  <div class="stages"></div>
  <div class="facts"></div>
  <div class="files"></div>
  <div class="two">
    <div>
      <h2>自动词库 <span class="hint" style="display:inline">glossary.md · 只读</span></h2>
      <textarea class="glossAuto" rows="10" readonly placeholder="没有自动词库（未开 pre-pass / OCR）——直接在右侧手写即可"></textarea>
    </div>
    <div>
      <h2>人工词库 <span class="hint" style="display:inline">glossary_user.md · 优先级高于自动词库</span></h2>
      <textarea class="glossUser" rows="10" placeholder="原文 -> 写法&#10;山川さん -> 山川宇衣&#10;ねこがみ -> 猫神"></textarea>
      <div class="glossary-actions">
        <div class="hint">保存后重跑：ASR / 合并 / pre-pass 全部命中缓存，只重新翻译。</div>
        <button class="saveGloss">保存</button>
        <button class="accent saveRerun">保存并重翻</button>
      </div>
    </div>
  </div>
  <div class="two" style="margin-top:16px">
    <div><h2>日志</h2><pre class="log"></pre></div>
    <div><h2 class="srtTitle">字幕预览</h2><pre class="srt"></pre></div>
  </div>
</template>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
